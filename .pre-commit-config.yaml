# default_stages keeps the file-filtered hooks above from running at the
# commit-msg stage, where the hook runner would otherwise feed them
# .git/COMMIT_EDITMSG; default_install_hook_types makes
# `prek install` install both hook types. Git stage names stay unchanged.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^uv\.lock$
  # ruff from the locked environment, so the hooks and `make lint` can
  # never disagree on the ruff version
  - repo: local
    hooks:
      - id: license-headers
        name: canonical license headers
        entry: make headers
        language: system
        pass_filenames: false
        always_run: true
      - id: cleanporter-fix
        name: cleanporter fix
        entry: uv run --frozen cleanporter --fix --whole-project
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: uv-lock
        name: uv lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # Whole-project checks: scope belongs to pyproject.toml, commands to Make.
      - id: mypy
        name: mypy (strict)
        entry: make type-mypy
        language: system
        files: \.(py|pyi)$|^(pyproject\.toml|uv\.lock|Makefile|\.pre-commit-config\.yaml)$
        pass_filenames: false
        require_serial: true
      - id: pyright
        name: pyright
        entry: make type-pyright
        language: system
        files: \.(py|pyi)$|^(pyproject\.toml|uv\.lock|Makefile|\.pre-commit-config\.yaml)$
        pass_filenames: false
        require_serial: true
      - id: zuban
        name: zuban
        entry: make type-zuban
        language: system
        files: \.(py|pyi)$|^(pyproject\.toml|uv\.lock|Makefile|\.pre-commit-config\.yaml)$
        pass_filenames: false
        require_serial: true
      - id: pyrefly
        name: pyrefly
        entry: make type-pyrefly
        language: system
        files: \.(py|pyi)$|^(pyproject\.toml|uv\.lock|Makefile|\.pre-commit-config\.yaml)$
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
