[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "array-vectorize"
version = "0.1.0"
description = "Source-to-source array vectorization: scalar Python functions compiled to Array API (NumPy/PyTorch/JAX/CuPy) functions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
    "array-api-compat>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://grAItools.github.io/array-vectorize/"
Source = "https://github.com/grAItools/array-vectorize"
Changelog = "https://github.com/grAItools/array-vectorize/blob/main/CHANGELOG.md"

# development-only dependencies (PEP 735); `uv sync` installs `dev`.
# The floors are tested: `make lowest` (and the CI `lowest` job) runs the
# suite with every direct dependency at its minimum.
[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.15",
    "mypy>=1.20",
    "pyright>=1.1.411",
    "zuban>=0.9.2",
    "pyrefly>=1.2",
    "coverage[toml]>=7.6",
    "numpy>=2.0",
    "array-api-strict>=2.3",
    "prek>=0.5",
    "pyyaml>=6.0",  # repository workflow and hook configuration tests
    "cleanporter>=0.6",
]
backends = [
    "jax>=0.4",
    "torch>=2.2",
]
docs = [
    "zensical>=0.0.67",
]
notebooks = [
    "marimo>=0.9",
    "numpy>=2.0",
    "array-api-strict>=2.3",
]

[tool.uv]
default-groups = ["dev"]

# CPU-only torch wheels: the CUDA builds are gigabytes and the backend
# tests only need tracing/compilation on CPU
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# 0.6.0 is the first release carrying the PEP 695 type-alias fix
cleanporter = { git = "https://github.com/grAItools/cleanporter", tag = "v0.6.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/array_vectorize"]

[tool.hatch.build.targets.wheel.force-include]
"src/array_vectorize/py.typed" = "array_vectorize/py.typed"

[tool.ruff]
target-version = "py312"
line-length = 100
# golden cases are compared to generated code; marimo owns the notebook format
extend-exclude = ["tests/golden/cases", "examples/notebooks"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
    "C4",      # flake8-comprehensions
    "PT",      # flake8-pytest-style
    "TID252",  # flake8-tidy-imports: absolute imports only
    "D",       # pydocstyle (google convention, see below)
    "N",       # pep8-naming
    "ICN",     # flake8-import-conventions
    # evaluated on the tree: zero violations, kept as guards
    "BLE001",  # blind except
    "PLW0603", # global statement
    "G004",    # logging f-strings
    "PGH003",  # blanket type-ignore
    "PGH004",  # blanket noqa
]
# the TID252 fix is unsafe-only by default; make `ruff check --fix` apply it
extend-safe-fixes = ["TID252"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# ruff's default ("parents") only flags `..` imports; every import in the
# tree is absolute
ban-relative-imports = "all"

[tool.ruff.lint.flake8-import-conventions]
# single source of truth for the import aliases
aliases = { numpy = "np" }

[tool.ruff.lint.per-file-ignores]
# scalar functions written for vectorize loop over range(N) for its trip
# count; the index is often unused by design
"examples/*" = ["B007"]
# test names are self-documenting
"tests/**" = ["D1"]
# corpus functions are golden-pinned test data
"tests/corpus.py" = ["D"]
# holds the NumPy-style docstring subject
"tests/behavior/test_docstrings.py" = ["D4"]

[tool.ruff.lint.isort]
# Google §3.13 import formatting
force-single-line = true
single-line-exclusions = ["typing", "collections.abc"]
force-sort-within-sections = true
order-by-type = false

[tool.cleanporter]
scope = "all"
# golden cases are pinned compiler output; marimo owns the notebook format
exclude = ["tests/golden/cases/", "examples/notebooks/"]
# unclassifiable imports (CP002) fail the gate, not only plain violations
treat_unresolved_as_error = true

[[tool.cleanporter.skip]]
file = 'tests/corpus\.py'
reason = "golden test data: from-imports deliberately exercise the supported subset"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = "array_api_compat"
ignore_missing_imports = true

# All four checkers are gates; Make owns commands and these sections own scope.
[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.zuban]
files = ["src", "tests", "scripts"]
mypy_path = ["src", "tests"]
python_version = "3.12"
strict = true
check_untyped_defs = true
# Compiler input data and optional heavyweight integration tests are not
# maintained test harness code. Zuban matches names during recursive discovery,
# so patterns must also match the basename, not just a repository-relative path.
exclude = [
    '(^|/)cases(/|$)',
    '(^|/)corpus\.py$',
    '(^|/)test_jax_torch_compilation\.py$',
]

[[tool.zuban.overrides]]
module = [
    "tests.*", "unit.*", "behavior.*", "features.*", "backends.*",
    "differential.*", "golden.*", "perf.*", "test_*", "support", "conftest",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[[tool.zuban.overrides]]
# Excluding discovery alone does not prevent imports from following corpus data.
module = ["corpus", "tests.corpus"]
follow_imports = "skip"

[[tool.zuban.overrides]]
module = "array_api_compat"
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
project-excludes = [
    "tests/golden/cases/**",
    "tests/corpus.py",
    "tests/backends/test_jax_torch_compilation.py",
    "**/__pycache__/**",
]
search-path = ["src", "tests"]
python-version = "3.12"
check-unannotated-defs = true
# This checkout can live under .paseo: default hidden-path exclusions skip tests.
disable-project-excludes-heuristics = true
replace-imports-with-any = ["corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --benchmark-disable"
strict = true
filterwarnings = [
    "error",
    # numpy emits these from documented divergence paths (runtime pow
    # overflow, div-by-zero on generated inputs); they are data-dependent,
    # not code smells
    "ignore:overflow encountered:RuntimeWarning",
    "ignore:invalid value encountered:RuntimeWarning",
    "ignore:divide by zero encountered:RuntimeWarning",
    # torch.compile (detected mode) traces array_api_compat's lru_cache-
    # wrapped type dispatch on first compile; dynamo's informational notice
    "ignore:Dynamo detected a call to a `functools.lru_cache`-wrapped function:UserWarning",
]
markers = [
    "slow: performance tests that are timing-sensitive",
    "timeout: per-test wall-clock limit (pytest-timeout)",
]

[tool.coverage.run]
source = ["src/array_vectorize"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "assert_never",
]
