[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "array-vectorize"
version = "0.1.0"
description = "Source-to-source array vectorization: scalar Python functions compiled to Array API (NumPy/PyTorch/JAX/CuPy) functions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
    "array-api-compat>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://grAItools.github.io/array-vectorize/"
Source = "https://github.com/grAItools/array-vectorize"
Changelog = "https://github.com/grAItools/array-vectorize/blob/main/CHANGELOG.md"

# development-only dependencies (PEP 735); `uv sync` installs `dev`.
# The floors are tested: `make lowest` (and the CI `lowest` job) runs the
# suite with every direct dependency at its minimum.
[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.15",
    "mypy>=1.20",
    "coverage[toml]>=7.6",
    "numpy>=2.0",
    "array-api-strict>=2.3",
    "pre-commit>=3.5",
]
backends = [
    "jax>=0.4",
    "torch>=2.2",
]
docs = [
    "zensical>=0.0.67",
]
notebooks = [
    "marimo>=0.9",
    "numpy>=2.0",
    "array-api-strict>=2.3",
]

[tool.uv]
default-groups = ["dev"]

# CPU-only torch wheels: the CUDA builds are gigabytes and the backend
# tests only need tracing/compilation on CPU
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/array_vectorize"]

[tool.hatch.build.targets.wheel.force-include]
"src/array_vectorize/py.typed" = "array_vectorize/py.typed"

[tool.ruff]
target-version = "py312"
line-length = 100
# golden cases are compared to generated code; marimo owns the notebook format
extend-exclude = ["tests/golden/cases", "examples/notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
# scalar functions written for vectorize loop over range(N) for its trip
# count; the index is often unused by design
"examples/*" = ["B007"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "array_api_compat"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --benchmark-disable"
strict = true
filterwarnings = [
    "error",
    # numpy emits these from documented divergence paths (runtime pow
    # overflow, div-by-zero on generated inputs); they are data-dependent,
    # not code smells
    "ignore:overflow encountered:RuntimeWarning",
    "ignore:invalid value encountered:RuntimeWarning",
    "ignore:divide by zero encountered:RuntimeWarning",
    # torch.compile (detected mode) traces array_api_compat's lru_cache-
    # wrapped type dispatch on first compile; dynamo's informational notice
    "ignore:Dynamo detected a call to a `functools.lru_cache`-wrapped function:UserWarning",
]
markers = [
    "slow: performance tests that are timing-sensitive",
    "timeout: per-test wall-clock limit (pytest-timeout)",
]

[tool.coverage.run]
source = ["src/array_vectorize"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "assert_never",
]
