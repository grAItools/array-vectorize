[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "array-vectorize"
version = "0.1.0"
description = "Source-to-source array vectorization: scalar Python functions compiled to Array API (NumPy/PyTorch/JAX/CuPy) functions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
    "array-api-compat>=1.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/grAItools/array-vectorize"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "coverage[toml]>=7.6",
    "numpy>=1.26",
    "array-api-strict>=1.0",
    "pre-commit>=3.5",
]
docs = [
    "zensical>=0.0.67",
]
notebooks = [
    "marimo>=0.9",
    "numpy>=1.26",
    "array-api-strict>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/array_vectorize"]

[tool.hatch.build.targets.wheel.force-include]
"src/array_vectorize/py.typed" = "array_vectorize/py.typed"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/golden/cases"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "array_api_compat"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --benchmark-disable"
strict_markers = true
filterwarnings = [
    "error",
    # numpy emits these from documented divergence paths (runtime pow
    # overflow, div-by-zero on generated inputs); they are data-dependent,
    # not code smells
    "ignore:overflow encountered:RuntimeWarning",
    "ignore:invalid value encountered:RuntimeWarning",
    "ignore:divide by zero encountered:RuntimeWarning",
]
markers = [
    "slow: performance tests that are timing-sensitive",
    "timeout: per-test wall-clock limit (pytest-timeout)",
]

[tool.coverage.run]
source = ["src/array_vectorize"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "assert_never",
]
