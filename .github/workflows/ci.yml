name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same PR supersedes the older run; main runs always
# finish (pages.yml deploys from their result)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint and all four type checkers
        run: make lint type

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Tests and coverage
        run: make coverage
        env:
          CI: "1"
      - name: Examples and notebooks
        run: make smoke

  windows:
    name: Windows correctness (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      CI: "1"
    steps:
      - name: Preserve repository symlinks
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Correctness tests
        run: uv run --frozen pytest -m "not slow" -ra

  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Test at the declared dependency floors
        run: make lowest

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Fuzz
        run: make fuzz

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group backends
      - name: Import guard
        run: uv run python -c "import jax, torch; print('jax', jax.__version__, '| torch', torch.__version__)"
      - name: Compilation tests
        run: make backends

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group docs
      - name: Build docs
        run: make docs

  # PR commit subjects follow Conventional Commits, the same rule the
  # local commit-msg hook enforces (compilerla/conventional-pre-commit,
  # pinned to the same tag); the full history is needed to walk the
  # PR's commit range
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check commit subjects
        run: |
          base="origin/${{ github.base_ref }}"
          status=0
          for sha in $(git rev-list --reverse --no-merges "$base"..HEAD); do
            git log -1 --format=%s "$sha" > /tmp/commit-subject.txt
            if ! uvx --from git+https://github.com/compilerla/conventional-pre-commit@v4.4.0 \
              conventional-pre-commit feat fix docs style refactor perf test build ci chore revert \
              /tmp/commit-subject.txt; then
              echo "::error::$(git log -1 --oneline "$sha") is not a Conventional Commit"
              status=1
            fi
          done
          exit $status
